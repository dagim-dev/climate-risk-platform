# Production deploy is deferred. This workflow is scaffolding only and does
# not run on push — trigger it manually after cloud infrastructure, secrets,
# and object storage for PDFs are provisioned. The app is not live.
name: Deploy

on:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: cd backend && pytest tests/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/climate_risk_test
          GOOGLE_MAPS_API_KEY: test-key
          OPENAI_API_KEY: test-key
          JWT_SECRET: test-jwt-secret
          APP_VERSION: 2.0.0

  deploy-frontend:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i -g vercel@latest
      - run: cd frontend && npm ci
      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: cd frontend && vercel deploy --prod --token "$VERCEL_TOKEN"

  deploy-backend:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'climate-risk-api' }}
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud run deploy "$SERVICE_NAME" \
            --source backend \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "ENVIRONMENT=production,APP_VERSION=2.0.0,CORS_ORIGINS=https://climaterisk.io,https://www.climaterisk.io" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,NOAA_API_KEY=NOAA_API_KEY:latest,SENTRY_DSN=SENTRY_DSN:latest,JWT_SECRET=JWT_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest"
