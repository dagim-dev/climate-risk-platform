services:
  db:
    image: postgres:16
    container_name: climate_risk_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: climate_risk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d climate_risk"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: climate_risk_backend
    # Apply migrations, then start the API with hot reload.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # backend/.env points at localhost for running outside Docker; inside the
      # compose network Postgres is the "db" service.
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/climate_risk
      API_BASE_URL: http://localhost:8000

  frontend:
    build: ./frontend
    container_name: climate_risk_frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.local
    environment:
      # The browser calls the API on localhost; the Next.js server (NextAuth
      # credentials login) calls it over the compose network.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://backend:8000
      AUTH_TRUST_HOST: "true"

volumes:
  postgres_data:
