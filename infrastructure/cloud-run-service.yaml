# Google Cloud Run service definition for the FastAPI backend.
# Apply with: gcloud run services replace infrastructure/cloud-run-service.yaml --region=us-central1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: climate-risk-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/climate-risk-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: production
            - name: APP_VERSION
              value: "2.0.0"
            - name: CORS_ORIGINS
              value: "https://climaterisk.io,https://www.climaterisk.io"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          # Secrets are injected from Google Secret Manager at deploy time.
          # See scripts/provision-cloud-run.sh for the gcloud deploy command.
